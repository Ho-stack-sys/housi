<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Housss.co.za
 </title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f6f8;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }

    .container {
      max-width: 500px;
      padding: 20px;
    }

    h1 {
      font-size: 36px;
      margin-bottom: 10px;
      color: #2c3e50;
    }

    p {
      font-size: 18px;
      color: #555;
      margin-bottom: 30px;
    }

    .logo {
      max-width: 120px;
      margin-bottom: 20px;
    }

    .loader {
      border: 6px solid #f3f3f3;
      border-top: 6px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    footer {
      font-size: 14px;
      color: #aaa;
      position: absolute;
      bottom: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Optional: Add your logo -->
     <img src="logo.png" alt="Logo" class="logo"> 

    <div class="loader"></div>

    <h1>We're Under Maintenance</h1>
    <p>We're currently improving our site to serve you better. Please check back soon.</p>
  </div>

  <footer>© 2025 houssrentals. All rights reserved.</footer>
</body>
</html>
